name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  # Backend Testing and Linting
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nena_user
          POSTGRES_PASSWORD: nena_password
          POSTGRES_DB: nena_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run database migrations
      run: |
        python -c "
        from app.db.base_class import Base, get_engine
        from app.models import *
        engine = get_engine()
        Base.metadata.create_all(bind=engine)
        print('Database setup complete')
        "

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Run linting
      run: |
        pip install pylint black isort
        pylint app/ --fail-under=7
        black --check app/
        isort --check-only app/

  # Frontend Testing and Building
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test -- --watchAll=false --coverage

    - name: Build application
      run: npm run build

  # Build and Push Docker Images
  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  # Deploy to Production
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e

          # Navigate to project directory
          cd /root/nena

          # Pull latest changes
          git fetch origin
          git checkout main
          git pull origin main

          # Update environment variables if needed
          # cp .env.example .env  # Uncomment if you have an example file

          # Stop existing containers
          docker compose -f docker-compose.prod.yml down || true

          # Pull latest images
          docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

          # Tag images for local use
          docker tag ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest nena-backend:latest
          docker tag ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest nena-frontend:latest

          # Start services
          docker compose -f docker-compose.prod.yml up -d

          # Wait for services to be healthy
          echo "Waiting for services to start..."
          sleep 30

          # Run database migrations
          docker compose -f docker-compose.prod.yml exec -T backend python -c "
          from app.db.base_class import Base, get_engine
          from app.models import *
          engine = get_engine()
          Base.metadata.create_all(bind=engine)
          print('Database migrations completed')
          "

          # Run health checks
          echo "Running health checks..."
          curl -f http://localhost:8000/docs || echo "Backend health check failed"
          curl -f http://localhost:8080 || echo "Frontend health check failed"

          echo "Deployment completed successfully!"
