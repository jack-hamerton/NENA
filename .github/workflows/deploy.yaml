name: Deploy to VPS (deploy-fixes)

on:
  push:
    branches:
      - deploy-fixes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/nena
            git fetch
            git checkout deploy-fixes
            git pull origin deploy-fixes
            docker compose -f docker-compose.prod.yml up -d --build