version: '3.8'

services:
  backend:
    image: nena-backend:latest
    container_name: nena-backend-prod
    command: gunicorn --config /app/gunicorn.conf.py app.main:app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=nena_user
      - POSTGRES_PASSWORD=nena_password
      - POSTGRES_DB=nena_db
      - DATABASE_URL=postgresql://nena_user:nena_password@db:5432/nena_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env.prod
    volumes:
      - ./backend/static:/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nena-frontend:latest
    container_name: nena-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: nena-postgres-prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=nena_user
      - POSTGRES_PASSWORD=nena_password
      - POSTGRES_DB=nena_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nena_user -d nena_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nena-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nena-nginx-prod
    ports:
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: nena-prod-network
